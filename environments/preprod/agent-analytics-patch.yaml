apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agent-analytics
spec:
  values:
    nameOverride: agent-analytics
    fullnameOverride: smartgenie-agent-analytics
    replicaCount: 2
    image:
      repository: ghcr.io/ss12dev/smartgenie-agent-analytics
      tag: sha-a47c6f0
      pullPolicy: IfNotPresent
    service:
      port: 80
      targetPort: 8080
    containerPort: 8080
    env:
      APP_ENV: preprod
      LOG_LEVEL: INFO
      APP_ROLE: analytics
      SERVICE_NAME: agent-analytics
      HEALTH_PATH: /health
    resources:
      requests:
        cpu: 150m
        memory: 192Mi
      limits:
        cpu: 300m
        memory: 384Mi
