apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartgenie-sample
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smartgenie-sample
  template:
    metadata:
      labels:
        app: smartgenie-sample
    spec:
      containers:
        - name: smartgenie-sample
          image: smartgenie-sample:local
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
