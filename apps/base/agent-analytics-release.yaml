apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agent-analytics
spec:
  interval: 5m0s
  releaseName: agent-analytics
  chart:
    spec:
      chart: ./charts/smartgenie-service
      sourceRef:
        kind: GitRepository
        name: sg-helm-charts
        namespace: flux-system
      interval: 1m0s
  install:
    createNamespace: false
  upgrade:
    remediation:
      retries: 3
  values:
    nameOverride: agent-analytics
    fullnameOverride: smartgenie-agent-analytics
    replicaCount: 1
    image:
      repository: ghcr.io/ss12dev/smartgenie-agent-analytics
      tag: qa-latest
      pullPolicy: IfNotPresent
    service:
      port: 80
      targetPort: 8080
    containerPort: 8080
    env:
      APP_ROLE: analytics
      SERVICE_NAME: agent-analytics
      HEALTH_PATH: /health
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 250m
        memory: 256Mi
